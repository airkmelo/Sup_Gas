spring.application.name=supgas
server.port=8080

# ---- Banco (Supabase / PostgreSQL) ----
# Valores vem de VARIAVEIS DE AMBIENTE: nunca coloque senha direto aqui
# (esse arquivo vai pro Git).
#
# DB_URL      = jdbc:postgresql://aws-0-REGIAO.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USER     = postgres.SEU_PROJECT_REF
# DB_PASSWORD = senha definida ao criar o projeto
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Plano gratis tem limite de conexoes: pool pequeno
spring.datasource.hikari.maximum-pool-size=5

# ---- JPA ----
# validate = o Hibernate so CONFERE se as entidades batem com as tabelas.
# Quem cria as tabelas e o schema.sql (voce controla o banco).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true